<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: #e8e0db;
            width: 100%;
        }
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 25px 80px;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-size: 12px;
            font-weight: bold;
        }
        .main_box{
            width: 80%;
            height: 400px;
            border: 1px solid grey;
            margin: 20px auto;
            display: flex;
        }
        .left_box{
            width: 50%;
            height: 100%;
            
            font-size: 30px;
        }
        .right_box{
            width: 50%;
            height: 100%;
           
            display: flex;
            justify-content: center;
           
        }
        .right_box img{
            width: 420px;
            height: 360px;
            margin-top: 20px;
        }
        .social_media a{
            text-decoration: none;
        
                 
        }
        .social_media{
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <a href="#">BIO</a>
            <a href="#">PORTFILO</a>
            <a href="#">PODCAST</a>
            <a href="#">BLOG</a>

        </nav>
        <div class="main_box">
            <div class="left_box">
                <h1> <center>Bethany Jones</center></h1>
                <p> <center>I'm a dedicated culture critic and blogger <br> located in San Francisco, Califonia.</center></p>
            <div class="social_media">
                <a href="https://www.instagram.com/?hl=en">Instagram</a>
                <a href="https://www.facebook.com/login/?next=https%3A%2F%2Fwww.facebook.com%2F">Facebook</a>
                <a href="https://x.com/?lang=en">Twitter</a>
            </div>
            </div>
            <div class="right_box">
                <img src="https://thumbs.dreamstime.com/b/smiling-girl-student-textbooks-portfolio-13596533.jpg" alt="girl image">
                
            </div>
        </div>
    </div>



</body>

</html>
